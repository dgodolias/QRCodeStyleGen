# Render.com Blueprint — deploys the same static build as Vercel.
# Create via: Render Dashboard → New → Blueprint → point at this repo.
services:
  - type: web
    name: qr-style-studio
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # Long-cache the fingerprinted assets.
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; form-action 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), interest-cohort=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains; preload
    # SPA fallback: serve index.html for client routes.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
